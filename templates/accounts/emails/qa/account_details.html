<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f8fc;border-radius:8px;">
  <tr><td style="padding:16px 18px;">
    <p style="margin:0 0 4px;font-size:11px;color:#647089;">Account</p>
    <p style="margin:0 0 12px;font-size:14px;line-height:1.5;word-break:break-all;">{{ account_email }}</p>
    <p style="margin:0 0 4px;font-size:11px;color:#647089;">New test password</p>
    <p style="margin:0;font-family:Consolas,'Courier New',monospace;font-size:16px;line-height:1.5;font-weight:700;word-break:break-all;">{{ test_password }}</p>
    {% if current_password %}<p style="margin:12px 0 0;font-size:11px;color:#647089;">Current: <span style="font-family:Consolas,'Courier New',monospace;color:#031b4e;">{{ current_password }}</span></p>{% endif %}
  </td></tr>
</table>
