<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject }}</title>
  <style>@media only screen and (max-width:560px){.email-pad{padding-left:22px!important;padding-right:22px!important}.email-title{font-size:25px!important}}</style>
</head>
<body style="margin:0;padding:0;background:#f4f6fb;color:#031b4e;font-family:Inter,'Segoe UI',Arial,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">{{ preheader }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fb;"><tr><td align="center" style="padding:24px 10px;">
    <!--[if mso]><table role="presentation" width="540"><tr><td><![endif]-->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:540px;background:#ffffff;border:1px solid #e7eaf2;border-radius:14px;overflow:hidden;">
      <tr><td height="4" bgcolor="#e81750" style="height:4px;font-size:0;line-height:0;">&nbsp;</td></tr>
      <tr><td class="email-pad" style="padding:24px 30px 12px;"><a href="{{ site_url }}"><img src="cid:ava-logo" width="132" height="56" alt="AVA Pharmacy Ltd" style="display:block;border:0;width:132px;height:56px;"></a></td></tr>
      <tr><td class="email-pad" style="padding:8px 30px 24px;">
        <h1 class="email-title" style="margin:0 0 10px;font-size:27px;line-height:1.25;color:#031b4e;">{{ heading }}</h1>
        <p style="margin:0 0 18px;font-size:14px;line-height:1.6;color:#647089;">{% block introduction %}{% endblock %}</p>
        {% include "accounts/emails/qa/account_details.html" %}
        {% block details %}{% endblock %}
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:20px 0 12px;"><tr><td bgcolor="#e81750" style="background:#e81750;border-radius:8px;mso-padding-alt:13px 22px;"><a href="{{ action_url }}" style="display:inline-block;padding:13px 22px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;">{{ action_label }}</a></td></tr></table>
        <p style="margin:0;font-size:12px;line-height:1.6;"><a href="{{ action_url }}" style="color:#c91444;">Open link instead</a></p>
      </td></tr>
      <tr><td class="email-pad" style="padding:16px 30px;background:#fafbfe;border-top:1px solid #eef0f6;">
        <p style="margin:0 0 5px;font-size:10px;font-weight:700;letter-spacing:1px;color:#991b1f;">FOR LOCAL QA TESTING</p>
        <p style="margin:0;font-size:11px;line-height:1.6;color:#647089;">Use on the computer running the website. Enter the password to apply it.</p>
      </td></tr>
    </table>
    <!--[if mso]></td></tr></table><![endif]-->
  </td></tr></table>
</body>
</html>
